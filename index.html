<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Control Dashboard</title>
    <!-- React & Babel for JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-nums { font-variant-numeric: tabular-nums; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Icon components (simplified Lucide-like icons for CDN usage)
        const Plus = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const Minus = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const Play = ({ size = 18, fill = "none" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        );
        const Pause = ({ size = 18, fill = "none" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        );
        const RotateCcw = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        );
        const Trash2 = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const UserPlus = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="17" y1="11" x2="23" y2="11"></line></svg>
        );
        const Maximize = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        );
        const Minimize = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
        );
        const Sun = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        );
        const Moon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        );
        const StickyNote = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"></path><path d="M15 3v6h6"></path><line x1="9" y1="13" x2="15" y2="13"></line><line x1="9" y1="17" x2="15" y2="17"></line></svg>
        );
        const Edit3 = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        );
        const Check = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const XIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const Globe = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        );

        const PipIcon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><rect x="12" y="11" width="8" height="6" rx="1" fill="currentColor"></rect></svg>
        );

        // Floating timer widget body. Uses inline styles only so it renders identically
        // in the floating panel.
        const FloatingTimerList = ({ items, isDarkMode, formatTime, onToggle, onReset, onAdjust, onUnfloat }) => {
            const fg = isDarkMode ? '#f8fafc' : '#0f172a';
            const sub = isDarkMode ? '#94a3b8' : '#64748b';
            const btn = (extra = {}) => ({
                width: 30, height: 30, borderRadius: 999, border: 'none', cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: isDarkMode ? '#1e293b' : '#e2e8f0', color: fg, ...extra
            });
            return (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, fontFamily: 'Inter, sans-serif' }}>
                    {items.map(s => {
                        const c = s.color || buildColorScheme('#3b82f6');
                        const done = s.secondsLeft === 0;
                        return (
                            <div key={s.id} style={{
                                background: isDarkMode ? '#0f172a' : c.lightBgCss,
                                border: `2px solid ${done ? '#dc2626' : (s.isRunning ? c.hex : (isDarkMode ? '#1e293b' : '#e2e8f0'))}`,
                                borderRadius: 16, padding: '8px 12px', color: fg
                            }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                                    <div style={{ minWidth: 0 }}>
                                        <div style={{ fontWeight: 800, fontSize: 14, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.name}</div>
                                        <div style={{ fontWeight: 800, fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: isDarkMode ? c.darkTextCss : c.lightTextCss }}>{s.exam}</div>
                                    </div>
                                    <button type="button" title="Remove from floating" onClick={() => onUnfloat(s.id)} style={btn({ width: 22, height: 22, background: 'transparent', color: sub, fontSize: 14 })}>✕</button>
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginTop: 4 }}>
                                    <div style={{
                                        fontSize: 38, fontWeight: 900, letterSpacing: '-0.04em', lineHeight: 1,
                                        fontVariantNumeric: 'tabular-nums', color: (done || s.secondsLeft < 300) ? '#dc2626' : fg
                                    }}>{done ? 'TIME UP' : formatTime(s.secondsLeft, false)}</div>
                                    <div style={{ display: 'flex', gap: 5, alignItems: 'center' }}>
                                        <button type="button" title="Subtract 1 minute" onClick={() => onAdjust(s.id, -60)} style={btn({ fontWeight: 800, fontSize: 11 })}>−1</button>
                                        <button type="button" title={s.isRunning ? 'Pause' : 'Start'} onClick={() => onToggle(s.id)} style={btn({
                                            width: 36, height: 36,
                                            background: s.isRunning ? (isDarkMode ? '#fff' : '#fff') : c.btnCss,
                                            color: s.isRunning ? '#0f172a' : '#fff', boxShadow: '0 2px 6px rgba(0,0,0,0.25)'
                                        })}>{s.isRunning ? <Pause size={15} fill="currentColor" /> : <Play size={15} fill="currentColor" />}</button>
                                        <button type="button" title="Add 1 minute" onClick={() => onAdjust(s.id, 60)} style={btn({ fontWeight: 800, fontSize: 11 })}>+1</button>
                                        <button type="button" title="Reset" onClick={() => onReset(s.id)} style={btn()}><RotateCcw size={13} /></button>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // In-page fallback (browsers without Document Picture-in-Picture): a draggable panel
        // that floats above the dashboard.
        const DraggableFloat = ({ isDarkMode, onClose, children }) => {
            const [pos, setPos] = useState({ x: Math.max(8, window.innerWidth - 380), y: 80 });
            const drag = useRef(null);
            const onDown = (e) => {
                drag.current = { dx: e.clientX - pos.x, dy: e.clientY - pos.y };
                e.currentTarget.setPointerCapture(e.pointerId);
            };
            const onMove = (e) => {
                if (!drag.current) return;
                setPos({
                    x: clamp(e.clientX - drag.current.dx, 0, window.innerWidth - 80),
                    y: clamp(e.clientY - drag.current.dy, 0, window.innerHeight - 40)
                });
            };
            const onUp = () => { drag.current = null; };
            return (
                <div style={{
                    position: 'fixed', left: pos.x, top: pos.y, width: 360, zIndex: 9999,
                    background: isDarkMode ? '#020617' : '#ffffff', borderRadius: 18, padding: 8,
                    boxShadow: '0 20px 50px rgba(0,0,0,0.35)', border: `1px solid ${isDarkMode ? '#1e293b' : '#e2e8f0'}`
                }}>
                    <div
                        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp}
                        title="Drag to move"
                        style={{ cursor: 'grab', touchAction: 'none', userSelect: 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '2px 6px 8px', fontSize: 10, fontWeight: 800, letterSpacing: '0.15em', textTransform: 'uppercase', color: isDarkMode ? '#94a3b8' : '#64748b' }}
                    >
                        <span>⠿ Floating Timer — drag to move</span>
                        <button type="button" onPointerDown={(e) => e.stopPropagation()} onClick={onClose} style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: 'inherit', fontSize: 14 }}>✕</button>
                    </div>
                    {children}
                </div>
            );
        };

        const COLOR_SCHEMES = [
            { id: 'blue', hex: '#3b82f6', label: 'Blue', swatch: 'bg-blue-500', border: 'border-blue-400', text: 'text-blue-600', ring: 'ring-blue-50', btn: 'bg-blue-600 hover:bg-blue-700', lightBg: 'bg-blue-50', footerBg: 'bg-blue-100/50', darkBg: 'bg-blue-900/20', darkText: 'text-blue-400', darkRing: 'ring-blue-900/30' },
            { id: 'purple', hex: '#a855f7', label: 'Purple', swatch: 'bg-purple-500', border: 'border-purple-400', text: 'text-purple-600', ring: 'ring-purple-50', btn: 'bg-purple-600 hover:bg-purple-700', lightBg: 'bg-purple-50', footerBg: 'bg-purple-100/50', darkBg: 'bg-purple-900/20', darkText: 'text-purple-400', darkRing: 'ring-purple-900/30' },
            { id: 'emerald', hex: '#10b981', label: 'Emerald', swatch: 'bg-emerald-500', border: 'border-emerald-400', text: 'text-emerald-600', ring: 'ring-emerald-50', btn: 'bg-emerald-600 hover:bg-emerald-700', lightBg: 'bg-emerald-50', footerBg: 'bg-emerald-100/50', darkBg: 'bg-emerald-900/20', darkText: 'text-emerald-400', darkRing: 'ring-emerald-900/30' },
            { id: 'amber', hex: '#f59e0b', label: 'Amber', swatch: 'bg-amber-500', border: 'border-amber-400', text: 'text-amber-600', ring: 'ring-amber-50', btn: 'bg-amber-600 hover:bg-amber-700', lightBg: 'bg-amber-50', footerBg: 'bg-amber-100/50', darkBg: 'bg-amber-900/20', darkText: 'text-amber-400', darkRing: 'ring-amber-900/30' },
            { id: 'rose', hex: '#f43f5e', label: 'Rose', swatch: 'bg-rose-500', border: 'border-rose-400', text: 'text-rose-600', ring: 'ring-rose-50', btn: 'bg-rose-600 hover:bg-rose-700', lightBg: 'bg-rose-50', footerBg: 'bg-rose-100/50', darkBg: 'bg-rose-900/20', darkText: 'text-rose-400', darkRing: 'ring-rose-900/30' },
            { id: 'indigo', hex: '#6366f1', label: 'Indigo', swatch: 'bg-indigo-500', border: 'border-indigo-400', text: 'text-indigo-600', ring: 'ring-indigo-50', btn: 'bg-indigo-600 hover:bg-indigo-700', lightBg: 'bg-indigo-50', footerBg: 'bg-indigo-100/50', darkBg: 'bg-indigo-900/20', darkText: 'text-indigo-400', darkRing: 'ring-indigo-900/30' },
            { id: 'teal', hex: '#14b8a6', label: 'Teal', swatch: 'bg-teal-500', border: 'border-teal-400', text: 'text-teal-600', ring: 'ring-teal-50', btn: 'bg-teal-600 hover:bg-teal-700', lightBg: 'bg-teal-50', footerBg: 'bg-teal-100/50', darkBg: 'bg-teal-900/20', darkText: 'text-teal-400', darkRing: 'ring-teal-900/30' },
            { id: 'cyan', hex: '#06b6d4', label: 'Cyan' },
            { id: 'fuchsia', hex: '#d946ef', label: 'Fuchsia' },
            { id: 'orange', hex: '#f97316', label: 'Orange' },
            { id: 'lime', hex: '#84cc16', label: 'Lime' },
            { id: 'sky', hex: '#0ea5e9', label: 'Sky' },
        ];

        // Color conversion helpers for arbitrary Color Wheel selection
        const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

        const hexToRgb = (hex) => {
            const clean = (hex || '#3b82f6').replace('#', '');
            const full = clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean.padEnd(6, '0');
            const num = parseInt(full, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        };

        const rgbToHex = (r, g, b) =>
            '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');

        const rgbToHsl = (r, g, b) => {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        };

        const hslToHex = (h, s, l) => {
            h = ((h % 360) + 360) % 360;
            s = clamp(s, 0, 100) / 100;
            l = clamp(l, 0, 100) / 100;
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
            const m = l - c / 2;
            let r = 0, g = 0, b = 0;
            if (h < 60) { r = c; g = x; }
            else if (h < 120) { r = x; g = c; }
            else if (h < 180) { g = c; b = x; }
            else if (h < 240) { g = x; b = c; }
            else if (h < 300) { r = x; b = c; }
            else { r = c; b = x; }
            return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
        };

        const buildColorScheme = (hexInput) => {
            const rgb = hexToRgb(hexInput);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            return {
                id: hex,
                hex,
                h: hsl.h,
                s: hsl.s,
                l: hsl.l,
                lightBgCss: `hsl(${hsl.h}, ${Math.max(45, hsl.s)}%, 96%)`,
                lightFooterCss: `hsla(${hsl.h}, ${Math.max(45, hsl.s)}%, 90%, 0.65)`,
                lightTextCss: `hsl(${hsl.h}, ${Math.max(60, hsl.s)}%, 38%)`,
                lightBorderCss: `hsl(${hsl.h}, ${Math.max(55, hsl.s)}%, 62%)`,
                lightRingCss: `hsla(${hsl.h}, ${Math.max(65, hsl.s)}%, 86%, 0.75)`,
                darkBgCss: `hsla(${hsl.h}, ${Math.max(50, hsl.s)}%, 18%, 0.28)`,
                darkFooterCss: `hsla(${hsl.h}, ${Math.max(45, hsl.s)}%, 12%, 0.55)`,
                darkTextCss: `hsl(${hsl.h}, ${Math.min(95, Math.max(65, hsl.s))}%, 72%)`,
                darkBorderCss: `hsl(${hsl.h}, ${Math.max(60, hsl.s)}%, 55%)`,
                darkRingCss: `hsla(${hsl.h}, ${Math.max(60, hsl.s)}%, 35%, 0.4)`,
                btnCss: `hsl(${hsl.h}, ${Math.max(65, hsl.s)}%, 46%)`
            };
        };

        // Interactive 2D Color Wheel + Shade Slider + Quick Presets
        const ColorWheelPicker = ({ valueHex, onChange, isDarkMode, compact = false }) => {
            const wheelRef = useRef(null);
            const [dragging, setDragging] = useState(false);
            const scheme = buildColorScheme(valueHex);
            const rgb = hexToRgb(scheme.hex);
            const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
            const wheelSize = compact ? 112 : 136;

            const pickFromWheelEvent = (clientX, clientY) => {
                if (!wheelRef.current) return;
                const rect = wheelRef.current.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = clientX - cx;
                const dy = clientY - cy;
                const radius = rect.width / 2;
                const dist = Math.min(radius, Math.hypot(dx, dy));
                // Angle: 0deg at top, clockwise to match conic-gradient(from 0deg)
                const angleDeg = ((Math.atan2(dy, dx) * 180) / Math.PI + 90 + 360) % 360;
                const sat = Math.round(clamp((dist / radius) * 100, 15, 100));
                const nextHex = hslToHex(angleDeg, sat, clamp(hsl.l, 38, 62));
                onChange(nextHex);
            };

            useEffect(() => {
                if (!dragging) return;
                const onMove = (e) => {
                    const pt = e.touches ? e.touches[0] : e;
                    pickFromWheelEvent(pt.clientX, pt.clientY);
                };
                const onUp = () => setDragging(false);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                window.addEventListener('touchmove', onMove);
                window.addEventListener('touchend', onUp);
                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onMove);
                    window.removeEventListener('touchend', onUp);
                };
            }, [dragging, hsl.l]);

            // Compute indicator position on the wheel
            const rRatio = clamp(hsl.s / 100, 0, 1);
            const rad = ((hsl.h - 90) * Math.PI) / 180;
            const thumbX = 50 + Math.cos(rad) * rRatio * 44;
            const thumbY = 50 + Math.sin(rad) * rRatio * 44;

            return (
                <div className={`p-3 rounded-2xl border ${isDarkMode ? 'bg-slate-900/70 border-slate-800' : 'bg-slate-50/90 border-slate-200'}`}>
                    <div className="flex flex-col sm:flex-row items-center gap-4">
                        {/* Interactive Conic-Gradient Color Wheel */}
                        <div
                            ref={wheelRef}
                            onMouseDown={(e) => { e.preventDefault(); setDragging(true); pickFromWheelEvent(e.clientX, e.clientY); }}
                            onTouchStart={(e) => { setDragging(true); const t = e.touches[0]; pickFromWheelEvent(t.clientX, t.clientY); }}
                            style={{
                                width: `${wheelSize}px`,
                                height: `${wheelSize}px`,
                                background: `radial-gradient(circle closest-side, rgba(255,255,255,0.92), transparent 92%), conic-gradient(from 0deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)`
                            }}
                            className="relative rounded-full cursor-crosshair shadow-inner ring-2 ring-black/10 dark:ring-white/15 shrink-0 select-none"
                            title="Drag anywhere on the color wheel to pick any color"
                        >
                            <span
                                style={{
                                    left: `${thumbX}%`,
                                    top: `${thumbY}%`,
                                    backgroundColor: scheme.hex
                                }}
                                className="absolute -translate-x-1/2 -translate-y-1/2 w-5 h-5 rounded-full border-2 border-white shadow-md pointer-events-none ring-1 ring-black/30"
                            />
                        </div>

                        {/* Shade / Lightness Slider + Hex Preview + Quick Swatches */}
                        <div className="flex-1 w-full space-y-2.5">
                            <div className="flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2">
                                    <span
                                        style={{ backgroundColor: scheme.hex }}
                                        className="w-7 h-7 rounded-xl shadow-sm border border-black/10 dark:border-white/20 shrink-0"
                                    />
                                    <div>
                                        <div className={`text-[11px] font-black uppercase tracking-wider ${isDarkMode ? 'text-slate-200' : 'text-slate-700'}`}>
                                            Custom Color Wheel
                                        </div>
                                        <div className="text-[10px] font-mono text-slate-400 uppercase">{scheme.hex}</div>
                                    </div>
                                </div>
                                <label
                                    title="Open system color dialog"
                                    className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-[11px] font-bold cursor-pointer transition-colors ${
                                        isDarkMode ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'
                                    }`}
                                >
                                    <span>More Colors</span>
                                    <input
                                        type="color"
                                        value={scheme.hex}
                                        onChange={(e) => onChange(e.target.value)}
                                        className="sr-only"
                                    />
                                </label>
                            </div>

                            {/* Brightness / Vibrancy Slider */}
                            <div className="space-y-1">
                                <div className="flex justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400">
                                    <span>Shade / Brightness</span>
                                    <span>{hsl.l}%</span>
                                </div>
                                <input
                                    type="range"
                                    min="28"
                                    max="68"
                                    value={clamp(hsl.l, 28, 68)}
                                    onChange={(e) => onChange(hslToHex(hsl.h, Math.max(45, hsl.s), parseInt(e.target.value, 10)))}
                                    style={{
                                        background: `linear-gradient(to right, ${hslToHex(hsl.h, Math.max(60, hsl.s), 28)}, ${hslToHex(hsl.h, Math.max(75, hsl.s), 50)}, ${hslToHex(hsl.h, Math.max(60, hsl.s), 68)})`
                                    }}
                                    className="w-full h-2.5 rounded-lg appearance-none cursor-pointer accent-slate-900 dark:accent-white"
                                />
                            </div>

                            {/* Quick Preset Swatches */}
                            <div className="flex flex-wrap items-center gap-1.5 pt-0.5">
                                {COLOR_SCHEMES.map(preset => {
                                    const active = preset.hex.toLowerCase() === scheme.hex.toLowerCase();
                                    return (
                                        <button
                                            key={preset.id}
                                            type="button"
                                            onClick={() => onChange(preset.hex)}
                                            title={preset.label}
                                            style={{ backgroundColor: preset.hex }}
                                            className={`w-5 h-5 rounded-full transition-transform ${
                                                active ? 'scale-125 ring-2 ring-offset-1 ring-slate-900 dark:ring-white dark:ring-offset-slate-900' : 'opacity-80 hover:opacity-100 hover:scale-110'
                                            }`}
                                        />
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const TIME_ZONES = [
            { label: 'Local Time', value: Intl.DateTimeFormat().resolvedOptions().timeZone },
            { label: 'London, UK', value: 'Europe/London' },
            { label: 'New York, USA', value: 'America/New_York' },
            { label: 'Tokyo, Japan', value: 'Asia/Tokyo' },
            { label: 'Dubai, UAE', value: 'Asia/Dubai' },
            { label: 'Paris, France', value: 'Europe/Paris' },
            { label: 'Sydney, Australia', value: 'Australia/Sydney' },
            { label: 'Singapore', value: 'Asia/Singapore' },
        ];

        const App = () => {
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [students, setStudents] = useState([
                { id: 1, name: 'Alex Johnson', exam: 'Math 101', secondsLeft: 3600, isRunning: false, initialSeconds: 3600, color: buildColorScheme(COLOR_SCHEMES[0].hex), notes: '', showNotes: false },
                { id: 2, name: 'Sarah Miller', exam: 'History Midterm', secondsLeft: 5400, isRunning: false, initialSeconds: 5400, color: buildColorScheme(COLOR_SCHEMES[1].hex), notes: '', showNotes: false }
            ]);

            const [currentTime, setCurrentTime] = useState(new Date());
            const [selectedTimeZone, setSelectedTimeZone] = useState(TIME_ZONES[0].value);
            const [selectedStudentIds, setSelectedStudentIds] = useState([]);
            const [fullscreenStudentIds, setFullscreenStudentIds] = useState([]);
            const [newName, setNewName] = useState('');
            const [newExam, setNewExam] = useState('');
            const [newHours, setNewHours] = useState(1);
            const [newMinutes, setNewMinutes] = useState(0);
            const [newColorHex, setNewColorHex] = useState(COLOR_SCHEMES[2].hex);
            const [showAddForm, setShowAddForm] = useState(false);

            // In-place card editing state
            const [editingStudentId, setEditingStudentId] = useState(null);
            const [editName, setEditName] = useState('');
            const [editExam, setEditExam] = useState('');
            const [editHours, setEditHours] = useState(1);
            const [editMinutes, setEditMinutes] = useState(0);
            const [editColorHex, setEditColorHex] = useState(COLOR_SCHEMES[0].hex);

            useEffect(() => {
                document.body.className = isDarkMode ? 'bg-slate-950' : 'bg-slate-50';
            }, [isDarkMode]);

            // Floating timer state. Uses a Document Picture-in-Picture window (always on top,
            // movable over any tab/app) when supported, else a draggable in-page panel.
            const [floatIds, setFloatIds] = useState([]);
            const [pipWin, setPipWin] = useState(null);
            const lastTickRef = useRef(Date.now());
            const pipSupported = typeof window !== 'undefined' && 'documentPictureInPicture' in window;

            // Tick based on real elapsed time so timers stay accurate even if the browser
            // throttles this tab. While the floating window is open, tick from its own
            // (unthrottled) timer context.
            useEffect(() => {
                const host = pipWin || window;
                lastTickRef.current = Date.now();
                const interval = host.setInterval(() => {
                    const now = Date.now();
                    const elapsed = Math.floor((now - lastTickRef.current) / 1000);
                    if (elapsed < 1) return;
                    lastTickRef.current += elapsed * 1000;
                    setCurrentTime(new Date());
                    setStudents((prev) =>
                        prev.map((s) => {
                            if (!s.isRunning) return s;
                            const next = s.secondsLeft - elapsed;
                            return next <= 0
                                ? { ...s, secondsLeft: 0, isRunning: false }
                                : { ...s, secondsLeft: next };
                        })
                    );
                }, 500);
                return () => host.clearInterval(interval);
            }, [pipWin]);

            // Close the PiP window once nothing is floating anymore
            useEffect(() => {
                if (floatIds.length === 0 && pipWin) {
                    pipWin.close();
                    setPipWin(null);
                }
            }, [floatIds, pipWin]);

            const openFloat = async (ids) => {
                const validIds = students.filter(s => ids.includes(s.id)).map(s => s.id);
                if (validIds.length === 0) return;
                if (pipSupported && !pipWin) {
                    try {
                        const w = await window.documentPictureInPicture.requestWindow({
                            width: 380,
                            height: Math.min(560, 40 + validIds.length * 130)
                        });
                        [...document.styleSheets].forEach(sheet => {
                            try {
                                const style = w.document.createElement('style');
                                style.textContent = [...sheet.cssRules].map(r => r.cssText).join('\n');
                                w.document.head.appendChild(style);
                            } catch (_) {
                                if (sheet.href) {
                                    const link = w.document.createElement('link');
                                    link.rel = 'stylesheet';
                                    link.href = sheet.href;
                                    w.document.head.appendChild(link);
                                }
                            }
                        });
                        w.document.body.style.margin = '0';
                        w.document.body.style.padding = '8px';
                        w.document.body.style.boxSizing = 'border-box';
                        // Scale the whole widget with the window size
                        const applyZoom = () => { w.document.body.style.zoom = Math.max(0.6, w.innerWidth / 380); };
                        w.addEventListener('resize', applyZoom);
                        applyZoom();
                        w.addEventListener('pagehide', () => { setPipWin(null); setFloatIds([]); });
                        setPipWin(w);
                    } catch (err) {
                        console.warn('Picture-in-Picture unavailable, using in-page floating timer', err);
                    }
                }
                setFloatIds(prev => [...new Set([...prev, ...validIds])]);
            };

            const toggleFloat = (id) => {
                if (floatIds.includes(id)) setFloatIds(prev => prev.filter(x => x !== id));
                else openFloat([id]);
            };

            const unfloat = (id) => setFloatIds(prev => prev.filter(x => x !== id));

            const formatTZTime = (date, tz) => {
                return new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                }).format(date);
            };

            const formatHHMM = (date, tz) => {
                return new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                }).format(date);
            };

            const formatTime = (totalSeconds, showHours = true) => {
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                if (showHours) {
                    return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
                return `${hrs > 0 ? hrs + ':' : ''}${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const openAddForm = () => {
                if (!showAddForm) {
                    const nextPreset = COLOR_SCHEMES[students.length % COLOR_SCHEMES.length];
                    setNewColorHex(nextPreset.hex);
                }
                setShowAddForm(!showAddForm);
            };

            const addStudent = (e) => {
                e.preventDefault();
                if (!newName.trim() || !newExam.trim()) return;
                const hrs = Math.max(0, parseInt(newHours, 10) || 0);
                const mins = Math.max(0, parseInt(newMinutes, 10) || 0);
                const totalSeconds = Math.max(60, (hrs * 3600) + (mins * 60));
                const chosenScheme = buildColorScheme(newColorHex);
                
                const newStudent = {
                    id: Date.now(),
                    name: newName.trim(),
                    exam: newExam.trim(),
                    secondsLeft: totalSeconds,
                    initialSeconds: totalSeconds,
                    isRunning: false,
                    color: chosenScheme,
                    notes: '',
                    showNotes: false
                };
                const nextList = [...students, newStudent];
                setStudents(nextList);
                setNewName('');
                setNewExam('');
                setNewColorHex(COLOR_SCHEMES[nextList.length % COLOR_SCHEMES.length].hex);
                setShowAddForm(false);
            };

            const startEditStudent = (student) => {
                setEditingStudentId(student.id);
                setEditName(student.name);
                setEditExam(student.exam);
                setEditHours(Math.floor(student.initialSeconds / 3600));
                setEditMinutes(Math.floor((student.initialSeconds % 3600) / 60));
                setEditColorHex(student.color?.hex || COLOR_SCHEMES[0].hex);
            };

            const cancelEditStudent = () => {
                setEditingStudentId(null);
            };

            const saveEditStudent = (e, id) => {
                e.preventDefault();
                if (!editName.trim() || !editExam.trim()) return;
                const hrs = Math.max(0, parseInt(editHours, 10) || 0);
                const mins = Math.max(0, parseInt(editMinutes, 10) || 0);
                const newInitialSeconds = Math.max(60, (hrs * 3600) + (mins * 60));
                const chosenScheme = buildColorScheme(editColorHex);

                setStudents(students.map(s => {
                    if (s.id !== id) return s;
                    const durationChanged = s.initialSeconds !== newInitialSeconds;
                    return {
                        ...s,
                        name: editName.trim(),
                        exam: editExam.trim(),
                        color: chosenScheme,
                        initialSeconds: newInitialSeconds,
                        secondsLeft: durationChanged ? newInitialSeconds : s.secondsLeft
                    };
                }));
                setEditingStudentId(null);
            };

            const adjustTime = (id, seconds) => {
                setStudents(students.map(s => 
                    s.id === id ? { ...s, secondsLeft: Math.max(0, s.secondsLeft + seconds) } : s
                ));
            };

            const toggleTimer = (id) => {
                setStudents(students.map(s => 
                    s.id === id ? { ...s, isRunning: !s.isRunning } : s
                ));
            };

            const resetTimer = (id) => {
                setStudents(students.map(s => 
                    s.id === id ? { ...s, secondsLeft: s.initialSeconds, isRunning: false } : s
                ));
            };

            // Master controls to start / pause / reset all timers (or specific subset) at once
            const startAllTimers = (ids = null) => {
                const idSet = ids ? new Set(ids) : null;
                setStudents(prev => prev.map(s => (!idSet || idSet.has(s.id)) && s.secondsLeft > 0 ? { ...s, isRunning: true } : s));
            };

            const pauseAllTimers = (ids = null) => {
                const idSet = ids ? new Set(ids) : null;
                setStudents(prev => prev.map(s => (!idSet || idSet.has(s.id)) ? { ...s, isRunning: false } : s));
            };

            const resetAllTimers = (ids = null) => {
                const idSet = ids ? new Set(ids) : null;
                setStudents(prev => prev.map(s => (!idSet || idSet.has(s.id)) ? { ...s, secondsLeft: s.initialSeconds, isRunning: false } : s));
            };

            // Multi-card selection & full-screen helpers
            const toggleSelectStudent = (id) => {
                setSelectedStudentIds(prev =>
                    prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
                );
            };

            const selectAllStudents = () => {
                if (selectedStudentIds.length === students.length) {
                    setSelectedStudentIds([]);
                } else {
                    setSelectedStudentIds(students.map(s => s.id));
                }
            };

            const openFullscreenForIds = (ids) => {
                const validIds = students.filter(s => ids.includes(s.id)).map(s => s.id);
                if (validIds.length > 0) {
                    setFullscreenStudentIds(validIds);
                }
            };

            const removeFromFullscreen = (id) => {
                setFullscreenStudentIds(prev => prev.filter(item => item !== id));
            };

            const removeStudent = (id) => {
                if (editingStudentId === id) setEditingStudentId(null);
                setSelectedStudentIds(prev => prev.filter(item => item !== id));
                setFullscreenStudentIds(prev => prev.filter(item => item !== id));
                setFloatIds(prev => prev.filter(item => item !== id));
                setStudents(students.filter(s => s.id !== id));
            };

            const updateNotes = (id, notes) => {
                setStudents(students.map(s => s.id === id ? { ...s, notes } : s));
            };

            const toggleNotes = (id) => {
                setStudents(students.map(s => s.id === id ? { ...s, showNotes: !s.showNotes } : s));
            };

            const onDragStart = (e, index) => {
                e.dataTransfer.setData('index', index);
            };

            const onDragOver = (e) => {
                e.preventDefault();
            };

            const onDrop = (e, dropIndex) => {
                const dragIndex = parseInt(e.dataTransfer.getData('index'));
                if (isNaN(dragIndex) || dragIndex === dropIndex) return;
                
                const newStudents = [...students];
                const [draggedItem] = newStudents.splice(dragIndex, 1);
                newStudents.splice(dropIndex, 0, draggedItem);
                setStudents(newStudents);
            };

            const currentDate = new Date().toLocaleDateString('en-US', { 
                weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' 
            });

            const isFullscreenOpen = fullscreenStudentIds.length > 0;
            const fullscreenStudents = students.filter(s => fullscreenStudentIds.includes(s.id));
            const activeStudents = students.filter(s => s.secondsLeft > 0);
            const allRunning = activeStudents.length > 0 && activeStudents.every(s => s.isRunning);
            const anyRunning = students.some(s => s.isRunning);
            const allSelected = students.length > 0 && selectedStudentIds.length === students.length;

            const getCardSurfaceStyle = (student, isSelected = false) => {
                if (student.secondsLeft === 0) return {};
                const c = student.color || buildColorScheme('#3b82f6');
                return {
                    backgroundColor: isDarkMode ? c.darkBgCss : c.lightBgCss,
                    borderColor: isSelected
                        ? c.hex
                        : (student.isRunning ? (isDarkMode ? c.darkBorderCss : c.lightBorderCss) : (isDarkMode ? '#1e293b' : '#e2e8f0')),
                    boxShadow: isSelected
                        ? `0 0 0 3px ${c.hex}`
                        : (student.isRunning ? `0 0 0 4px ${isDarkMode ? c.darkRingCss : c.lightRingCss}` : undefined)
                };
            };

            // Adaptive grid layout & typography based on how many cards are in Fullscreen
            const getFullscreenGridConfig = (count) => {
                if (count === 1) {
                    return {
                        gridClass: 'grid-cols-1 max-w-6xl mx-auto',
                        padClass: 'p-8 md:p-12',
                        examClass: 'text-lg md:text-2xl tracking-[0.4em] mb-2',
                        nameClass: 'text-3xl md:text-5xl mb-6',
                        timerClass: 'text-[5.5rem] sm:text-[8.5rem] md:text-[11.5rem] lg:text-[13.5rem] mb-6',
                        metaClass: 'text-base md:text-lg gap-8 mb-6',
                        playBtnClass: 'w-24 h-24',
                        playIconSize: 38,
                        stepBtnClass: 'w-16 h-16',
                        stepIconSize: 26
                    };
                }
                if (count === 2) {
                    return {
                        gridClass: 'grid-cols-1 lg:grid-cols-2',
                        padClass: 'p-6 md:p-8',
                        examClass: 'text-xs md:text-sm tracking-[0.3em] mb-1',
                        nameClass: 'text-2xl md:text-4xl mb-4',
                        timerClass: 'text-[4.5rem] sm:text-[6rem] md:text-[7.5rem] xl:text-[9rem] mb-4',
                        metaClass: 'text-xs md:text-sm gap-4 mb-5',
                        playBtnClass: 'w-16 h-16 md:w-20 md:h-20',
                        playIconSize: 28,
                        stepBtnClass: 'w-12 h-12 md:w-14 md:h-14',
                        stepIconSize: 22
                    };
                }
                if (count <= 4) {
                    return {
                        gridClass: 'grid-cols-1 md:grid-cols-2',
                        padClass: 'p-4 md:p-6',
                        examClass: 'text-[11px] md:text-xs tracking-[0.25em] mb-0.5',
                        nameClass: 'text-xl md:text-2xl mb-2',
                        timerClass: 'text-5xl sm:text-6xl md:text-7xl xl:text-8xl mb-3',
                        metaClass: 'text-xs gap-3 mb-3',
                        playBtnClass: 'w-14 h-14',
                        playIconSize: 22,
                        stepBtnClass: 'w-11 h-11',
                        stepIconSize: 18
                    };
                }
                return {
                    gridClass: 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3',
                    padClass: 'p-4',
                    examClass: 'text-[10px] tracking-[0.2em] mb-0.5',
                    nameClass: 'text-lg md:text-xl mb-1.5',
                    timerClass: 'text-4xl sm:text-5xl xl:text-6xl mb-2.5',
                    metaClass: 'text-[11px] gap-2.5 mb-2.5',
                    playBtnClass: 'w-12 h-12',
                    playIconSize: 18,
                    stepBtnClass: 'w-10 h-10',
                    stepIconSize: 16
                };
            };

            return (
                <div className={`min-h-screen px-4 py-3 md:px-6 md:py-4 transition-colors duration-500 ${isDarkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
                    <header className={`max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 mb-4 pb-3 border-b ${isDarkMode ? 'border-slate-800' : 'border-slate-200'} ${isFullscreenOpen ? 'opacity-20 blur-sm pointer-events-none' : ''}`}>
                        {/* Left: Prominent Cropped App Logo + Compact Title */}
                        <div className="flex items-center gap-3.5">
                            <img src="logo.png" alt="Exam Timer Logo" className="h-14 md:h-16 w-auto object-contain drop-shadow-md select-none" />
                            <div>
                                <h1 className={`text-2xl md:text-3xl font-black tracking-tight uppercase leading-none ${isDarkMode ? 'text-white' : 'text-slate-800'}`}>Exam Control</h1>
                                <p className={`font-semibold uppercase tracking-widest text-[10px] mt-1 ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                                    Room Proctoring Dashboard <span className="mx-1.5 opacity-40">•</span> {currentDate}
                                </p>
                            </div>
                        </div>

                        {/* Right: Master Controls + Multi-Select Fullscreen + Compact World Clock + Theme + Add Student */}
                        <div className="flex flex-wrap items-center gap-2">
                            {/* Master Start/Pause/Reset All Controls */}
                            {students.length > 0 && (
                                <div className={`inline-flex items-center gap-1 p-1 rounded-xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                    <button
                                        onClick={() => allRunning ? pauseAllTimers() : startAllTimers()}
                                        disabled={activeStudents.length === 0}
                                        title={allRunning ? 'Pause all running timers' : 'Start all timers at once'}
                                        className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg font-bold text-xs transition-all active:scale-95 disabled:opacity-40 ${
                                            allRunning
                                                ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-sm'
                                                : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'
                                        }`}
                                    >
                                        {allRunning ? <Pause size={14} fill="currentColor" /> : <Play size={14} fill="currentColor" />}
                                        <span>{allRunning ? 'Pause All' : 'Start All'}</span>
                                    </button>
                                    {anyRunning && !allRunning && (
                                        <button
                                            onClick={() => pauseAllTimers()}
                                            title="Pause all running timers"
                                            className={`inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-bold text-xs transition-all active:scale-95 ${
                                                isDarkMode ? 'bg-slate-800 text-amber-400 hover:bg-slate-700' : 'bg-amber-50 text-amber-700 hover:bg-amber-100'
                                            }`}
                                        >
                                            <Pause size={13} fill="currentColor" />
                                            <span>Pause</span>
                                        </button>
                                    )}
                                    <button
                                        onClick={() => resetAllTimers()}
                                        title="Reset all timers"
                                        className={`inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg font-bold text-xs transition-all active:scale-95 ${
                                            isDarkMode ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                                        }`}
                                    >
                                        <RotateCcw size={13} />
                                        <span className="hidden sm:inline">Reset All</span>
                                    </button>
                                </div>
                            )}

                            {/* Multi-Card Fullscreen Selection Controls */}
                            {students.length > 0 && (
                                <div className={`inline-flex items-center gap-1 p-1 rounded-xl border shadow-sm ${isDarkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                                    <button
                                        onClick={selectAllStudents}
                                        title={allSelected ? 'Clear card selection' : 'Select all cards for fullscreen'}
                                        className={`inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg font-bold text-xs transition-all active:scale-95 ${
                                            allSelected
                                                ? (isDarkMode ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-900')
                                                : (isDarkMode ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100')
                                        }`}
                                    >
                                        <span className={`w-3.5 h-3.5 rounded flex items-center justify-center border ${
                                            allSelected ? 'bg-blue-600 border-blue-600 text-white' : (isDarkMode ? 'border-slate-600' : 'border-slate-300')
                                        }`}>
                                            {allSelected && <Check size={10} />}
                                        </span>
                                        <span>{allSelected ? 'Clear' : 'Select All'}</span>
                                    </button>

                        const fsAnyRunning = fullscreenStudents.some(s => s.isRunning);

                        return (
                            <div className="fixed inset-0 z-50 flex flex-col bg-slate-950/85 backdrop-blur-2xl animate-fade-in p-3 md:p-6 overflow-y-auto">
                                {/* Top Fullscreen Control Bar */}
                                <div className={`w-full max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 px-4 py-2.5 mb-3 rounded-2xl border shadow-lg ${
                                    isDarkMode ? 'bg-slate-900/90 border-slate-800 text-white' : 'bg-white/95 border-slate-200 text-slate-900'
                                }`}>
                                    <div className="flex items-center gap-3">
                                        <img src="logo.png" alt="Logo" className="h-9 w-auto object-contain" />
                                        <div>
                                            <span className="text-xs font-black uppercase tracking-widest">
                                                Fullscreen View ({count} {count === 1 ? 'Card' : 'Cards'})
                                            </span>
                                            <div className="text-[11px] font-bold text-slate-400">
                                                {formatTZTime(currentTime, selectedTimeZone)}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2">
                                        {count > 1 && (
                                            <>
                                                <button
                                                    onClick={() => fsAllRunning ? pauseAllTimers(fsIds) : startAllTimers(fsIds)}
                                                    disabled={fsActive.length === 0}
                                                    className={`inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl font-bold text-xs transition-all active:scale-95 disabled:opacity-40 text-white shadow-sm ${
                                                        fsAllRunning ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'
                                                    }`}
                                                >
                                                    {fsAllRunning ? <Pause size={14} fill="currentColor" /> : <Play size={14} fill="currentColor" />}
                                                    <span>{fsAllRunning ? 'Pause All Fullscreen' : 'Start All Fullscreen'}</span>
                                                </button>
                                                {fsAnyRunning && !fsAllRunning && (
                                                    <button
                                                        onClick={() => pauseAllTimers(fsIds)}
                                                        className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-xs transition-all active:scale-95 ${
                                                            isDarkMode ? 'bg-slate-800 text-amber-400 hover:bg-slate-700' : 'bg-amber-50 text-amber-700 hover:bg-amber-100'
                                                        }`}
                                                    >
                                                        <Pause size={14} fill="currentColor" />
                                                        <span>Pause Running</span>
                                                    </button>
                                                )}
                                                <button
                                                    onClick={() => resetAllTimers(fsIds)}
                                                    className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-xl font-bold text-xs transition-all active:scale-95 ${
                                                        isDarkMode ? 'bg-slate-800 text-slate-300 hover:text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                                    }`}
                                                >
                                                    <RotateCcw size={14} />
                                                    <span>Reset All</span>
                                                </button>
                                            </>
                                        )}
                                        <button
                                            onClick={() => setFullscreenStudentIds([])}
                                            title="Exit fullscreen"
                                            className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-xl font-bold text-xs transition-all active:scale-95 ${
                                                isDarkMode ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-slate-900 text-white hover:bg-slate-800'
                                            }`}
                                        >
                                            <Minimize size={15} />
                                            <span>Exit Fullscreen</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Responsive Fullscreen Cards Grid */}
                                <div className={`w-full max-w-7xl mx-auto flex-1 grid ${cfg.gridClass} gap-4 items-stretch`}>
                                    {fullscreenStudents.map(fsStudent => {
                                        const fc = fsStudent.color || buildColorScheme('#3b82f6');
                                        return (
                                            <div
                                                key={fsStudent.id}
                                                style={{
                                                    backgroundColor: isDarkMode ? '#0f172a' : fc.lightBgCss,
                                                    borderColor: fsStudent.secondsLeft === 0
                                                        ? '#dc2626'
                                                        : (fsStudent.isRunning ? (isDarkMode ? fc.darkBorderCss : fc.lightBorderCss) : (isDarkMode ? '#1e293b' : '#ffffff'))
                                                }}
                                                className="rounded-[2.25rem] shadow-2xl relative overflow-hidden transition-all duration-300 border-4 flex flex-col justify-between"
                                            >
                                                {count > 1 && (
                                                    <button
                                                        onClick={() => removeFromFullscreen(fsStudent.id)}
                                                        title="Remove this card from fullscreen view"
                                                        className={`absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-full transition-all z-10 ${
                                                            isDarkMode ? 'bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700' : 'bg-white/70 hover:bg-white text-slate-700 shadow-sm'
                                                        }`}
                                                    >
                                                        <XIcon size={16} />
                                                    </button>
                                                )}

                                                <div className={`flex-1 flex flex-col items-center justify-center text-center ${cfg.padClass}`}>
                                                    <p
                                                        style={{ color: isDarkMode ? fc.darkTextCss : fc.lightTextCss }}
                                                        className={`font-black uppercase ${cfg.examClass}`}
                                                    >
                                                        {fsStudent.exam}
                                                    </p>
                                                    <h2 className={`font-black text-center leading-tight ${cfg.nameClass} ${isDarkMode ? 'text-white' : 'text-slate-800'}`}>
                                                        {fsStudent.name}
                                                    </h2>

                                                    <div className={`${cfg.timerClass} font-black tab-nums tracking-tighter leading-none ${
                                                        fsStudent.secondsLeft < 300 ? 'text-red-600 animate-pulse' : (isDarkMode ? 'text-white' : 'text-slate-900')
                                                    }`}>
                                                        {formatTime(fsStudent.secondsLeft, false)}
                                                    </div>

                                                    {/* Time Reference Group */}
                                                    <div className={`flex flex-wrap items-center justify-center font-black uppercase tracking-[0.2em] ${cfg.metaClass} ${isDarkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                                                        <div className="flex items-center gap-2">
                                                            <span>Now</span>
                                                            <span className={`px-3 py-1 rounded-xl ${isDarkMode ? 'bg-white/5 text-white' : 'bg-black/5 text-slate-800'}`}>
                                                                {formatHHMM(currentTime, selectedTimeZone)}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <span>Ends</span>
                                                            <span className={`px-3 py-1 rounded-xl ${isDarkMode ? 'bg-white/5 text-white' : 'bg-black/5 text-slate-800'}`}>
                                                                {formatHHMM(new Date(currentTime.getTime() + fsStudent.secondsLeft * 1000), selectedTimeZone)}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {fsStudent.notes && (
                                                        <div className={`max-w-xl w-full px-4 py-2.5 rounded-2xl border mb-4 text-center ${
                                                            isDarkMode ? 'bg-slate-950/40 border-slate-800 text-slate-300' : 'bg-white/60 border-black/5 text-slate-700'
                                                        }`}>
                                                            <p className="text-sm font-medium italic">"{fsStudent.notes}"</p>
                                                        </div>
                                                    )}

                                                    <div className="flex gap-4 items-center">
                                                        <button
                                                            onClick={() => adjustTime(fsStudent.id, -60)}
                                                            title="Subtract 1 minute"
                                                            className={`${cfg.stepBtnClass} flex items-center justify-center rounded-2xl transition-all ${isDarkMode ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-black/5 text-slate-700 hover:bg-black/10'}`}
                                                        >
                                                            <Minus size={cfg.stepIconSize} />
                                                        </button>
                                                        <button
                                                            onClick={() => toggleTimer(fsStudent.id)}
                                                            style={!fsStudent.isRunning ? { backgroundColor: fc.btnCss } : undefined}
                                                            className={`${cfg.playBtnClass} flex items-center justify-center rounded-full transition-all shadow-xl active:scale-95 ${
                                                                fsStudent.isRunning
                                                                    ? (isDarkMode ? 'bg-white text-slate-900' : 'bg-white text-slate-800')
                                                                    : 'text-white hover:brightness-110'
                                                            }`}
                                                        >
                                                            {fsStudent.isRunning ? <Pause size={cfg.playIconSize} fill="currentColor" /> : <Play size={cfg.playIconSize} fill="currentColor" className="ml-1" />}
                                                        </button>
                                                        <button
                                                            onClick={() => adjustTime(fsStudent.id, 60)}
                                                            title="Add 1 minute"
                                                            className={`${cfg.stepBtnClass} flex items-center justify-center rounded-2xl transition-all shadow-sm border ${isDarkMode ? 'bg-slate-800 border-slate-700 text-white hover:bg-slate-700' : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'}`}
                                                        >
                                                            <Plus size={cfg.stepIconSize} />
                                                        </button>
                                                    </div>
                                                </div>

                                                <div
                                                    style={!isDarkMode ? { backgroundColor: fc.lightFooterCss } : undefined}
                                                    className={`px-5 py-3 flex justify-center border-t transition-colors ${isDarkMode ? 'bg-slate-950/40 border-slate-800' : 'border-black/5'}`}
                                                >
                                                    <button
                                                        onClick={() => resetTimer(fsStudent.id)}
                                                        className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition-all ${isDarkMode ? 'bg-slate-800 text-white hover:bg-slate-700' : 'bg-white text-slate-600 hover:bg-white'}`}
                                                    >
                                                        <RotateCcw size={15} /> Reset Exam
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
